# Render Blueprint — Nathan N.O portfolio API
#
# One service:
#   nathan-portfolio-api → Flask + gunicorn web service (Backend/)
#
# The frontend is deployed separately on Vercel (see Frontend/vercel.json).
# Deploy: Render Dashboard → New → Blueprint → point at this repo.

services:
  - type: web
    name: nathan-portfolio-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      # Protects /api/admin/*. Render generates the value — read it in the
      # dashboard (Environment tab) to query admin endpoints with ?token=...
      - key: ADMIN_TOKEN
        generateValue: true
      # The SQLite file lives on the instance's ephemeral disk, so messages are
      # cleared on redeploy. To persist, add a disk and uncomment DATABASE_PATH:
      # disk:
      #   name: portfolio-data
      #   mountPath: /var/data
      #   sizeGB: 1
      # envVars:
      #   - key: DATABASE_PATH
      #     value: /var/data/portfolio.db
