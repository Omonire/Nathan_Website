# Render Blueprint — Nathan N.O portfolio
#
# Two services:
#   nathan-portfolio-api  → Flask + gunicorn web service (Backend/)
#   nathan-portfolio      → React + Vite static site    (Frontend/)
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# The frontend receives the backend URL automatically via VITE_API_URL.

services:
  # ---------------------------------------------------------------- Backend API
  - type: web
    name: nathan-portfolio-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      # Protects /api/admin/*. Render generates the value — read it in the
      # dashboard (Environment tab) to query admin endpoints with ?token=...
      - key: ADMIN_TOKEN
        generateValue: true
      # The SQLite file lives on the instance's ephemeral disk, so messages are
      # cleared on redeploy. To persist, add a disk and uncomment DATABASE_PATH:
      # disk:
      #   name: portfolio-data
      #   mountPath: /var/data
      #   sizeGB: 1
      # envVars:
      #   - key: DATABASE_PATH
      #     value: /var/data/portfolio.db

  # ------------------------------------------------------------- Frontend (SPA)
  - type: web
    name: nathan-portfolio
    runtime: static
    branch: main
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time; points the app at the API service.
      - key: VITE_API_URL
        fromService:
          name: nathan-portfolio-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # SPA fallback for client-side routes like /work/:slug.
      # Render serves real files (assets, robots.txt) before applying this.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
