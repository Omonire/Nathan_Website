# Render Blueprint — Nathan N.O portfolio API
#
# Two resources:
#   nathan-portfolio-db  → free PostgreSQL (primary data store)
#   nathan-portfolio-api → Flask + gunicorn web service (Backend/)
#
# The frontend is deployed separately on Vercel (see Frontend/vercel.json).
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
#
# Manual setup instead of Blueprint: create the PostgreSQL instance yourself and
# add its connection string as the DATABASE_URL env var on the web service.

databases:
  - name: nathan-portfolio-db
    plan: free
    region: oregon
    databaseName: nathan_portfolio
    user: nathan

services:
  - type: web
    name: nathan-portfolio-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      # PostgreSQL in production (DB=1). Unset/0 would fall back to SQLite.
      - key: DB
        value: "1"
      # Protects /api/admin/*. Render generates the value — read it in the
      # dashboard (Environment tab) to query admin endpoints with ?token=...
      - key: ADMIN_TOKEN
        generateValue: true
      # Admin dashboard login. The frontend posts these to /api/admin/login,
      # which returns a short-lived session token — the password never ships to
      # the browser. Set ADMIN_PASS to a strong value in the dashboard.
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
      # Primary database. Required when DB=1.
      - key: DATABASE_URL
        fromDatabase:
          name: nathan-portfolio-db
          property: connectionString
